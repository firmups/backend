      description: Requires at least one stage and a final stage reaching 100%. No firmware is pushed until the first advance.
      operationId: startRollout
      parameters:
        - name: id
          in: path
          description: ID of the rollout
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Rollout started
          content:
