        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RolloutDevice"
        "404":
          description: Rollout not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
components:
  schemas:
    NewDeviceType:
      type: object
      properties:
        name:
          type: string
      required:
        - name
    UpdateDeviceType:
      type: object
      properties:
        name:
          type: string
    DeviceType:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
      required:
        - id
        - name
    DeviceStatus:
      type: string
      enum: ["active", "inactive", "maintenance"]
    NewDevice:
      type: object
      properties:
        name:
          type: string
        type_:
          description: Device type id
          type: integer
        firmware:
          type: integer
          nullable: true
        desired_firmware:
          type: integer
        status:
          $ref: "#/components/schemas/DeviceStatus"
        gateway_id:
          description: ID of the gateway device this device communicates through
          type: integer
          nullable: true
      required:
        - name
        - type_
        - desired_firmware
        - status
    UpdateDevice:
      type: object
      properties:
        name:
          type: string
        firmware:
          type: integer
        desired_firmware:
          type: integer
        status:
          $ref: "#/components/schemas/DeviceStatus"
        gateway_id:
          description: Gateway device this device communicates through. Omit to leave unchanged, set to null to clear.
          type: integer
          nullable: true
    Device:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        type_:
          description: Device type id
          type: integer
        firmware:
          type: integer
          nullable: true
        desired_firmware:
          type: integer
        status:
          $ref: "#/components/schemas/DeviceStatus"
        gateway_id:
          description: ID of the gateway device this device communicates through
          type: integer
          nullable: true
      required:
        - id
        - name
        - type_
        - desired_firmware
        - status
    KeyType:
      type: string
      enum: ["lightweight"]
    LightweightKeyAlgorithm:
      type: string
      enum: ["aes_gcm128", "ascon_aead128"]
    LightweightKeyDetails:
      type: object
      properties:
        algorithm:
          $ref: "#/components/schemas/LightweightKeyAlgorithm"
        key:
          type: string
          format: byte
          examples: ["RklSTVVQUyBydWxlcw=="]
          description: Base64 encoded key matching the selected algorithm.
      required:
        - algorithm
        - key
    NewDeviceKey:
      type: object
      properties:
        key_type:
          $ref: "#/components/schemas/KeyType"
        details:
          $ref: "#/components/schemas/LightweightKeyDetails"
      required:
        - key_type
        - details
    DeviceKey:
      type: object
      properties:
        id:
          type: integer
        key_type:
          $ref: "#/components/schemas/KeyType"
        details:
          $ref: "#/components/schemas/LightweightKeyDetails"
      required:
        - key_type
        - details
    NewFirmware:
      type: object
      properties:
        name:
          type: string
        version:
          type: string
        file:
          type: string
          format: binary
      required:
        - name
        - version
        - file
    Firmware:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        version:
          type: string
        file_id:
          type: string
        size:
          type: string
        sha256:
          type: string
      required:
        - name
        - version
        - file_id
        - size
        - sha256
    NewDeviceTypeFirmware:
      type: object
      properties:
        device_type:
          description: Id of the device type to link
          type: integer
        firmware:
          description: Id of the firmware to link
          type: integer
      required:
        - device_type
        - firmware
    DeviceTypeFirmware:
      type: object
      properties:
        id:
          type: integer
        device_type:
          description: Id of the device type to link
          type: integer
        firmware:
          description: Id of the firmware to link
          type: integer
    ParameterType:
      type: string
      enum: ["string", "integer", "boolean", "float", "binary"]
    NewDeviceTypeParameter:
      type: object
      properties:
        key:
          type: string
        type:
          $ref: "#/components/schemas/ParameterType"
        default_value:
          description: "Default value encoded according to the parameter type: string for String, number for Integer/Float, boolean for Boolean, base64 string for Binary"
          oneOf:
            - type: string
            - type: number
            - type: boolean
      required:
        - key
        - type
    DeviceTypeParameter:
      type: object
      properties:
        id:
          type: integer
        device_type:
          type: integer
        key:
          type: string
        type:
          $ref: "#/components/schemas/ParameterType"
        default_value:
          description: "Default value encoded according to the parameter type: string for String, number for Integer/Float, boolean for Boolean, base64 string for Binary"
          oneOf:
            - type: string
            - type: number
            - type: boolean
      required:
        - id
        - device_type
        - key
        - type
    DeviceParameter:
      type: object
      properties:
        device_type_parameter:
          type: integer
          description: ID of the DeviceTypeParameter this value belongs to
        key:
          type: string
        type:
          $ref: "#/components/schemas/ParameterType"
        value:
          description: "Effective value (override if set, otherwise the type default)"
          oneOf:
            - type: string
            - type: number
            - type: boolean
        is_override:
          type: boolean
          description: true if this is a device-specific override, false if using the type default
      required:
        - device_type_parameter
        - key
        - type
        - value
        - is_override
    SetDeviceParameter:
      type: object
      properties:
        value:
          description: "New value encoded according to the parameter type"
          oneOf:
            - type: string
            - type: number
            - type: boolean
      required:
        - value
    UpdateDeviceTypeParameter:
      type: object
      properties:
        key:
          type: string
      required:
        - key
    RolloutStatusEnum:
      type: string
      enum: ["draft", "active", "paused", "completed", "cancelled"]
    RolloutStageStatus:
      type: string
      enum: ["pending", "in_progress", "completed"]
    PrerequisiteOperator:
      type: string
      description: "eq/ne apply to all parameter types; lt/lte/gt/gte are only valid for integer and float parameters"
      enum: ["eq", "ne", "lt", "lte", "gt", "gte"]
    NewRollout:
      type: object
      properties:
        name:
          type: string
        device_type:
          description: Id of the device type this rollout targets
          type: integer
        firmware:
          description: Id of the target firmware (must be linked to the device type)
          type: integer
      required:
        - name
        - device_type
        - firmware
    UpdateRollout:
      type: object
      properties:
        name:
          type: string
      required:
        - name
    Rollout:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        device_type:
          type: integer
        firmware:
          description: Id of the target firmware
          type: integer
        status:
          $ref: "#/components/schemas/RolloutStatusEnum"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - device_type
        - firmware
        - status
        - created_at
        - updated_at
    NewRolloutPrerequisite:
      type: object
      properties:
        device_type_parameter:
          description: Id of the DeviceTypeParameter to test (must belong to the rollout's device type)
          type: integer
        operator:
          $ref: "#/components/schemas/PrerequisiteOperator"
        value:
          description: "Comparison value encoded according to the parameter type: string for String, number for Integer/Float, boolean for Boolean, base64 string for Binary"
          oneOf:
            - type: string
            - type: number
            - type: boolean
      required:
        - device_type_parameter
        - operator
        - value
    RolloutPrerequisite:
      type: object
      properties:
        id:
          type: integer
        device_type_parameter:
          type: integer
        key:
          description: Key of the referenced parameter
          type: string
        type:
          $ref: "#/components/schemas/ParameterType"
        operator:
          $ref: "#/components/schemas/PrerequisiteOperator"
        value:
          description: "Comparison value encoded according to the parameter type"
          oneOf:
            - type: string
            - type: number
            - type: boolean
      required:
        - id
        - device_type_parameter
        - key
        - type
        - operator
        - value
    NewRolloutStage:
      type: object
      properties:
        stage_order:
          description: Execution order (>= 1). target_percent must strictly increase with this.
          type: integer
        target_percent:
          description: Cumulative percentage of the eligible population reached by the end of this stage (1-100)
          type: integer
        success_threshold_percent:
          description: Percentage of this stage's cohort that must converge before the next stage can start (0-100, defaults to 100)
          type: integer
          default: 100
      required:
        - stage_order
        - target_percent
    RolloutStage:
      type: object
      properties:
        id:
          type: integer
        rollout:
          type: integer
        stage_order:
          type: integer
        target_percent:
          type: integer
        success_threshold_percent:
          type: integer
        status:
          $ref: "#/components/schemas/RolloutStageStatus"
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - rollout
        - stage_order
        - target_percent
        - success_threshold_percent
        - status
    RolloutStageProgress:
      type: object
      properties:
        id:
          type: integer
        stage_order:
          type: integer
        target_percent:
          type: integer
        success_threshold_percent:
          type: integer
        status:
          $ref: "#/components/schemas/RolloutStageStatus"
        cohort_size:
          description: Number of eligible devices in this stage's cumulative cohort
          type: integer
        targeted:
          description: Cohort devices whose desired_firmware is the target firmware
          type: integer
        converged:
          description: Cohort devices whose current firmware is the target firmware
          type: integer
      required:
        - id
        - stage_order
        - target_percent
        - success_threshold_percent
        - status
        - cohort_size
        - targeted
        - converged
    RolloutStatus:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        status:
          $ref: "#/components/schemas/RolloutStatusEnum"
        device_type:
          type: integer
        firmware:
          type: integer
        eligible:
          description: Total number of eligible devices
          type: integer
        targeted:
          description: Eligible devices whose desired_firmware is the target firmware
          type: integer
        converged:
          description: Eligible devices whose current firmware is the target firmware
          type: integer
        stages:
          type: array
          items:
            $ref: "#/components/schemas/RolloutStageProgress"
      required:
        - id
        - name
        - status
        - device_type
        - firmware
        - eligible
        - targeted
        - converged
        - stages
    RolloutDevice:
      type: object
      properties:
        device:
          description: Device id
          type: integer
        targeted:
          type: boolean
        converged:
          type: boolean
        stage_order:
          description: Lowest stage (by order) whose cumulative cohort includes this device; null if not yet in any cohort
          type: integer
          nullable: true
      required:
        - device
        - targeted
        - converged
    InternalError:
      description: Masked internal error. The id can be matched with the backend logs.
      type: object
      properties:
        error_id:
          type: string
      required:
        - error_id
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error
  requestBodies:

  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
