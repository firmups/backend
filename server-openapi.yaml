          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Rollout not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Rollout is not in draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
  /rollout/{id}/advance:
    post:
      tags:
        - Rollout
      security:
        - api_key: []
      summary: Advance the rollout to the next stage
      description: >
        Completes the current in-progress stage once its cohort has converged to at least its
        success_threshold_percent (current firmware == target), then sets desired_firmware on the
        next stage's cumulative cohort and marks it in_progress. When the final stage's threshold is
        met, the rollout becomes completed. Blocked with 409 if the current stage has not converged.
      operationId: advanceRollout
      parameters:
        - name: id
          in: path
          description: ID of the rollout
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Rollout advanced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RolloutStatus"
        "404":
          description: Rollout not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Rollout is not active, or the current stage has not converged enough to advance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
  /rollout/{id}/pause:
    post:
      tags:
        - Rollout
      security:
        - api_key: []
      summary: Pause an active rollout (active -> paused)
