            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Rollout is not paused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
  /rollout/{id}/cancel:
    post:
      tags:
        - Rollout
      security:
        - api_key: []
      summary: Cancel a rollout
      description: Allowed from draft, active or paused. Already-applied desired_firmware values are left untouched (no rollback).
      operationId: cancelRollout
      parameters:
        - name: id
          in: path
          description: ID of the rollout
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Rollout cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rollout"
        "404":
