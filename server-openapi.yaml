openapi: 3.1.0
info:
  title: FIRMUPS Server API
  version: "0.1.0"
  description: |
    The firmups server API allows for device and update management.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
externalDocs:
  description: Find out more about Swagger
  url: https://swagger.io
servers:
  - url: "http://127.0.0.1:3000"
    description: Local development server
tags:
  - name: DeviceType
    description: DeviceType endpoints
  - name: DeviceTypeParameter
    description: Parameters defined on a device type
  - name: Device
    description: All about the devices in the field
  - name: DeviceKey
    description: Keys used for device backend communication
  - name: Firmware
    description: Firmware endpoints
  - name: DeviceTypeFirmware
    description: Link between firmware and DeviceType
  - name: Rollout
    description: Staged firmware rollouts with parameter-based prerequisites
paths:
  /device_type:
    get:
      tags:
        - DeviceType
      security:
        - api_key: []
      summary: List all device types
      operationId: listDeviceTypes
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeviceType"
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
    post:
      tags:
        - DeviceType
      security:
        - api_key: []
      summary: Create a new device type
      operationId: createDeviceType
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewDeviceType"
      responses:
        "201":
          description: Device type created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceType"
        "400":
          description: Invalid name provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Device type already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Input data could not be parsed
          content:
            application/json:
              schema:
                type: string
                description: Parse error description
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
  /device_type/{id}:
    get:
      tags:
        - DeviceType
      security:
        - api_key: []
      summary: Get device type
      operationId: getDeviceType
      parameters:
        - name: id
          in: path
          description: ID of the DeviceType to be returned
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceType"
        "404":
          description: Device type not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
    patch:
      tags:
        - DeviceType
      security:
        - api_key: []
      summary: Update an existing device type
      operationId: updateDeviceType
      parameters:
        - name: id
          in: path
          description: ID of the DeviceType to be updated
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDeviceType"
      responses:
        "200":
          description: Device type updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceType"
        "400":
          description: Invalid name provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Device type not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Device type already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Input data could not be parsed
          content:
            application/json:
              schema:
                type: string
                description: Parse error description
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
    delete:
      tags:
        - DeviceType
      security:
        - api_key: []
      summary: Delete device type
      operationId: deleteDeviceType
      parameters:
        - name: id
          in: path
          description: ID of the DeviceType to be deleted
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceType"
        "404":
          description: Device type not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
  /device_type/{id}/parameter:
    get:
      tags:
        - DeviceTypeParameter
      security:
        - api_key: []
      summary: List all parameters of the device type
      operationId: listDeviceTypeParameters
      parameters:
        - name: id
          in: path
          description: ID of the DeviceType
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeviceTypeParameter"
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
    post:
      tags:
        - DeviceTypeParameter
      security:
        - api_key: []
      summary: Create a new parameter for the device type
      operationId: createDeviceTypeParameter
      parameters:
        - name: id
          in: path
          description: ID of the DeviceType
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewDeviceTypeParameter"
      responses:
        "201":
          description: Parameter created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceTypeParameter"
        "404":
          description: Device type not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "A parameter with the same key already exists on this device type, or no default_value was provided while devices of this type already exist (every existing device would be missing a value for the new parameter)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Input data could not be parsed
          content:
            application/json:
              schema:
                type: string
                description: Parse error description
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
  /device_type/{id}/parameter/{param_id}:
    get:
      tags:
        - DeviceTypeParameter
      security:
        - api_key: []
      summary: Get a parameter of the device type
      operationId: getDeviceTypeParameter
      parameters:
        - name: id
          in: path
          description: ID of the DeviceType
          required: true
          schema:
            type: integer
        - name: param_id
          in: path
          description: ID of the DeviceTypeParameter
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceTypeParameter"
        "404":
          description: Parameter not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
    patch:
      tags:
        - DeviceTypeParameter
      security:
        - api_key: []
      summary: Update a parameter of the device type
      operationId: updateDeviceTypeParameter
      parameters:
        - name: id
          in: path
          description: ID of the DeviceType
          required: true
          schema:
            type: integer
        - name: param_id
          in: path
          description: ID of the DeviceTypeParameter
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDeviceTypeParameter"
      responses:
        "200":
          description: Parameter updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceTypeParameter"
        "404":
          description: Parameter not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Parameter key already exists for this device type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Input data could not be parsed
          content:
            application/json:
              schema:
                type: string
                description: Parse error description
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
    delete:
      tags:
        - DeviceTypeParameter
      security:
        - api_key: []
      summary: Delete a parameter of the device type
      operationId: deleteDeviceTypeParameter
      parameters:
        - name: id
          in: path
          description: ID of the DeviceType
          required: true
          schema:
            type: integer
        - name: param_id
          in: path
          description: ID of the DeviceTypeParameter
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceTypeParameter"
        "404":
          description: Parameter not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Cannot delete parameter because devices of this type already exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
  /device:
    get:
      tags:
        - Device
      security:
        - api_key: []
      summary: List all devices
      operationId: listDevices
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Device"
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
    post:
      tags:
        - Device
      security:
        - api_key: []
      summary: Create a new device
      operationId: createDevice
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewDevice"
      responses:
        "201":
          description: Device created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "400":
          description: Invalid input data provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Device already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Input data could not be parsed
          content:
            application/json:
              schema:
                type: string
                description: Parse error description
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
  /device/{id}:
    get:
      tags:
        - Device
      security:
        - api_key: []
      summary: Get device
      operationId: getDevice
      parameters:
        - name: id
          in: path
          description: ID of the Device to be returned
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "404":
          description: Device not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
    patch:
      tags:
        - Device
      security:
        - api_key: []
      summary: Update an existing device
      operationId: updateDevice
      parameters:
        - name: id
          in: path
          description: ID of the Device to be updated
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDevice"
      responses:
        "200":
          description: Device updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "400":
          description: Invalid input data provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Device not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Device already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Input data could not be parsed
          content:
            application/json:
              schema:
                type: string
                description: Parse error description
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
    delete:
      tags:
        - Device
      security:
        - api_key: []
      summary: Delete device
      operationId: deleteDevice
      parameters:
        - name: id
          in: path
          description: ID of the Device to be deleted
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "404":
          description: Device not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
  /device/{id}/parameter:
    get:
      tags:
        - Device
      security:
        - api_key: []
      summary: List all effective parameter values for the device
      operationId: listDeviceParameters
      parameters:
        - name: id
          in: path
          description: ID of the Device
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeviceParameter"
        "404":
          description: Device not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
  /device/{id}/parameter/{param_id}:
    get:
      tags:
        - Device
      security:
        - api_key: []
      summary: Get effective value of a single device parameter
      operationId: getDeviceParameter
      parameters:
        - name: id
          in: path
          description: ID of the Device
          required: true
          schema:
            type: integer
        - name: param_id
          in: path
          description: ID of the DeviceTypeParameter
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceParameter"
        "404":
          description: Device or parameter not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
    put:
      tags:
        - Device
      security:
        - api_key: []
      summary: Set a device parameter value. If the value equals the type default it is removed as an override.
      operationId: setDeviceParameter
      parameters:
        - name: id
          in: path
          description: ID of the Device
          required: true
          schema:
            type: integer
        - name: param_id
          in: path
          description: ID of the DeviceTypeParameter
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetDeviceParameter"
      responses:
        "200":
          description: Parameter value set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceParameter"
        "400":
          description: Value type does not match the parameter type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Device or parameter not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Input data could not be parsed
          content:
            application/json:
              schema:
                type: string
                description: Parse error description
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
    delete:
      tags:
        - Device
      security:
        - api_key: []
      summary: Reset a device parameter to its type default
      operationId: resetDeviceParameter
      parameters:
        - name: id
          in: path
          description: ID of the Device
          required: true
          schema:
            type: integer
        - name: param_id
          in: path
          description: ID of the DeviceTypeParameter
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Parameter reset to default
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceParameter"
        "404":
          description: Device or parameter not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Parameter has no default value and cannot be reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
  /device/{device_id}/key:
    get:
      tags:
        - DeviceKey
      security:
        - api_key: []
      summary: List all keys of the device
      operationId: listDeviceKeys
      parameters:
        - name: device_id
          in: path
          description: ID of the Device for which the keys shall be fetched
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeviceKey"
        "404":
          description: Device not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
    post:
      tags:
        - DeviceKey
      security:
        - api_key: []
      summary: Create a new key for the device
      operationId: createDeviceKey
      parameters:
        - name: device_id
          in: path
          description: ID of the Device for which the key shall be created
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewDeviceKey"
      responses:
        "201":
          description: Device key created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceKey"
        "404":
          description: Device not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Key with state "NEXT" already present on device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Input data could not be parsed
          content:
            application/json:
              schema:
                type: string
                description: Parse error description
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
  /device/{device_id}/key/{id}:
    get:
      tags:
        - DeviceKey
      security:
        - api_key: []
      summary: Get device key
      operationId: getDeviceKey
      parameters:
        - name: device_id
          in: path
          description: ID of the Device which the key belongs to
          required: true
          schema:
            type: integer
        - name: id
          in: path
          description: ID of the DeviceKey to be returned
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceKey"
        "404":
          description: Device key not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
    delete:
      tags:
        - DeviceKey
      security:
        - api_key: []
      summary: Delete device key
      operationId: deleteDeviceKey
      parameters:
        - name: device_id
          in: path
          description: ID of the Device which the key belongs to
          required: true
          schema:
            type: integer
        - name: id
          in: path
          description: ID of the DeviceKey to be deleted
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceKey"
        "404":
          description: Device key not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
  /firmware:
    get:
      tags:
        - Firmware
      security:
        - api_key: []
      summary: List all firmwares
      operationId: listFirmwares
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Firmware"
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
    post:
      tags:
        - Firmware
      security:
        - api_key: []
      summary: Create a new firmware
      operationId: createFirmware
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/NewFirmware"
      responses:
        "201":
          description: Firmware
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Firmware"
        "400":
          description: Invalid input data provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Firmware already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Input data could not be parsed
          content:
            application/json:
              schema:
                type: string
                description: Parse error description
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
  /firmware/{id}:
    get:
      tags:
        - Firmware
      security:
        - api_key: []
      summary: Get firmware
      operationId: getFirmware
      parameters:
        - name: id
          in: path
          description: ID of the Firmware to be returned
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Firmware"
        "404":
          description: Firmware not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
    delete:
      tags:
        - Firmware
      security:
        - api_key: []
      summary: Delete firmware
      operationId: deleteFirmware
      parameters:
        - name: id
          in: path
          description: ID of the Firmware to be deleted
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
