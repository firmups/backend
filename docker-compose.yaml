  #   environment:
  #     MINIO_ROOT_USER: minioadmin
  #     MINIO_ROOT_PASSWORD: minioadmin
  #   ports:
  #     - "3900:3900"
  #     - "3901:3901"
  #     - "3902:3902"
  #     - "3903:3903"
  #   networks:
  #     - backend
  #     - public
  #   volumes:
  #     - ./garage/garage.toml:/etc/garage.toml
  #     - storage-data:/var/lib/garage
  #   healthcheck:
  #     test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3903/health || exit 1"]
  #     interval: 10s
  #     timeout: 3s
  #     retries: 10

volumes:
  pg-data:
  firmups-data:
  storage-data:

networks:
  backend:
    internal: true
  public:
    driver: bridge
