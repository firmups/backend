apiVersion: v1
kind: Secret
metadata:
  name: {{ include "firmups.fullname" . }}-db-credentials
  labels:
    {{- include "firmups.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.postgresql.password | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "firmups.fullname" . }}-app
  labels:
    {{- include "firmups.labels" . | nindent 4 }}
type: Opaque
stringData:
  apiKey: {{ .Values.app.apiKey | quote }}
  storageKeyId: {{ .Values.storage.keyId | quote }}
  storageAccessKey: {{ .Values.storage.accessKey | quote }}
