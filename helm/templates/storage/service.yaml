{{- if .Values.storage.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "firmups.fullname" . }}-storage-headless
  labels:
    {{- include "firmups.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage
spec:
  clusterIP: None
  selector:
    {{- include "firmups.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: storage
  ports:
    - name: rpc
      port: 3901
      targetPort: rpc
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "firmups.fullname" . }}-storage
  labels:
    {{- include "firmups.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage
spec:
  type: ClusterIP
  selector:
    {{- include "firmups.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: storage
  ports:
    - name: s3
      port: 3900
      targetPort: s3
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "firmups.fullname" . }}-storage-admin
  labels:
    {{- include "firmups.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage
spec:
  type: ClusterIP
  selector:
    {{- include "firmups.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: storage
  ports:
    - name: admin
      port: 3903
      targetPort: admin
      protocol: TCP
{{- end }}
