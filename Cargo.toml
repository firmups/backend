[package]
name = "firmups-backend"
version = "0.1.4"
edition = "2024"
publish = false

[dependencies]
axum = { version="0.8.9", features = ["macros", "multipart"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.52", features = ["full"] }
diesel = { version = "2.3", features = ["uuid", "chrono"] }
diesel-derive-enum = { version = "2.1", features = ["postgres"] }
diesel-async = { version = "0.9", features = ["postgres", "bb8", "migrations"] }
dotenvy = "0.15"
log = "0.4.32"
uuid = { version = "1.23.2", features = ["v4", "serde"] }
minicbor = { version = "2.2.2", features = ["std"] }
aes-gcm = "0.10.3"
ascon-aead128 = "0.1.0-rc.3"
ascon = "=0.5.0-rc.0"
getrandom = "0.4.2"
chrono = { version = "0.4.45", features = ["serde"] }
tokio-util = { version = "0.7.18", features = ["io"] }
sha2 = "0.11.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2.5"
base64 = "0.22.1"
serde_json = "1.0"
thiserror = "2.0.18"
zeroize = "1.8.2"
async-trait = "0.1.89"
anyhow = "1.0.102"
aws-config = "1.8.18"
aws-sdk-s3 = { version = "1.135.0", features = ["rt-tokio"] }
futures-core = "0.3.32"
